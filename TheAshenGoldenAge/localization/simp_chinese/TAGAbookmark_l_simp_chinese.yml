l_simp_chinese:
 bm_group_FJin:"荆棘铜驼"
 bm_group_LiuMin:"回首望长安"
 start_year_313_4_1_desc:"孝怀皇帝被杀害，中原几近沦入敌手，长安苦苦支撑，但时日无多，贵族和百姓们不得不背起行囊，奔赴南方，长安远如天日。然而，长江天堑不只对胡骑奏效。"
 bm_group_PJin:"昔年种柳"
 start_year_361_11_17_desc:"陶侃、诸庾经略荆州日久，而如今，这里迎来了新的主人——桓温，他几乎以雷霆之势平定了益州，并不断北伐，企图克复中原，然而，中枢对他充满戒心，北方也早已从混乱中恢复，慕容氏遏制住了桓温扩张的势头，却未曾注意到，关中已有人在蓄势待发。"
 bm_FJin_heji:"大乱之间"
 bm_FJin_heji_desc:"席卷大半个中国的张昌石冰之乱被平定，斗争日久的成都河间二王分出了胜负，乱世或将终结。 \n\n#bold 李雄僭号成都，占据益州大部，刘渊离石起兵，声威日甚，庸暗胆怯的罗尚、司马腾决非其敌手，而中枢疲惫孱弱，亦无力予以支援。"
 bm_group_BeiFu:"气吞万里"
 bm_group_BeiFu_desc:"谢玄出镇广陵，开始筹备一支强大的军队，天王的目光投向了襄阳。"
 bm_PJin_ZhiGong:"石城之围"
 bm_PJin_ZhiGong_desc:"陶侃死后，曾经酿下大乱的庾亮接任了荆州刺史，旋即大肆筹备北伐。事实证明，他决非超世之杰。羯人进逼石城，荆州危在旦夕。\n\n#bold 然而，不凡者也开始崭露头角，成为他们一员，颠覆整个世界。抑或博揽声名，先复兴家族。#!"
 bm_PJin_YuanZi:"西征伐蜀"
 bm_PJin_YuanZi_desc:"烈勋之后执掌荆州，便把目光投向成都，他集结了一万大军，沿三峡进入了益州。\n\n#bold 蜀中尚有数万精锐，与其上次被攻破时并无差异，但若坚守到底，亦可转祸为安。不过沸沸的北方确已无法干预此事。#!"
 bm_PJin_NanJun:"权倾朝野"
 bm_PJin_NanJun_desc:"洛阳已被收复，桓温和把持朝廷的司马昱及王述的斗争却愈发激烈，王猛在关中开始了紧锣密鼓的改革，慕容恪早已是建康最大的威胁。\n\n#bold 书法家王羲之、皇帝司马聃相继去世，慕容恪、谢安登上舞台，新旧代际已然发生。#!"
 bm_PJin_XuanWu:"桓温之死"
 bm_PJin_XuanWu_desc:"王坦之和谢安断绝了桓温的九锡梦，大司马撒手人寰。他的弟弟们迅速接管了他留下的权力，\n\n#bold 前燕早已灭亡，梁州益州相继沦陷，危机不断迫近，桓冲一向谦让，建康重新得到了权力，以及相应的责任。#!"