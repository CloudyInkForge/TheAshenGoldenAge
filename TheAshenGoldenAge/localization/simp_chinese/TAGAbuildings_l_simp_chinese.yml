l_simp_chinese:
 building_type_taga_xian_01: "县廷"
 building_type_taga_xian_01_desc: "这种帝国的底层行政区维持起来并不容易，但也是帝国的租调徭役所系，庞大的官署区配合上英明的令长，或能有所成效。"
 building_taga_xian_01: "寺曹"
 building_taga_xian_01_desc: "官署区是县的根本，创造了它的权力，也带来了不小的成本。"
 building_taga_xian_02: "中型县"
 building_taga_xian_02_desc: "逐渐壮大的县成熟了起来，强大的组织能力令他敢于面对大部分不虞。"
 building_taga_xian_03: "大型县"
 building_taga_xian_03_desc: "以万计的农户聚集在了行政区内，这是发展的动力，不过县令精力有限，行政成本因而增加。"
 building_taga_xian_04: "巨型县"
 building_taga_xian_04_desc: "西汉的中原，宋时的江南，这样的县只会出现在帝国的核心区，成本巨大，收益颇丰。"

 building_type_taga_ag_jgl_01: "牧田"
 building_type_taga_ag_jgl_01_desc: "草原边缘的耕作地，农牧兼用，地力一般。"
 
 building_taga_ag_jgl_01: "草畦"
 building_taga_ag_jgl_01_desc: "刚开垦的草地小田，漫撒耐旱杂粮，靠天收成。"
 
 building_taga_ag_jgl_02: "围篱田"
 building_taga_ag_jgl_02_desc: "用简易围篱保护耕地，青稞与黍并种，开始选种。"
 
 building_taga_ag_jgl_03: "间作田"
 building_taga_ag_jgl_03_desc: "黍、粟、青稞分地块种植，施行轮歇，保持地力。"
 
 building_taga_ag_jgl_04: "熟化牧田"
 building_taga_ag_jgl_04_desc: "多年耕作使土壤熟化，仍一年一熟，但收成趋于稳定。"
 
 building_type_taga_ag_gob_01: "牧地"
 building_type_taga_ag_gob_01_desc: "以放牧为主，农耕稀少，土地产出低。"
 
 building_taga_ag_gob_01: "牧地小畦"
 building_taga_ag_gob_01_desc: "牧地旁零星开垦的小块地，只种最耐旱的黍。"
 
 building_taga_ag_gob_02: "定居牧田"
 building_taga_ag_gob_02_desc: "半定居者开辟的固定田块，黍与青稞并种，补充牧业。"
 
 building_taga_ag_gob_03: "轮歇牧田"
 building_taga_ag_gob_03_desc: "耕地与撂荒地轮换，靠休耕恢复地力，畜粪为肥。"
 
 building_taga_ag_gob_04: "精管牧田"
 building_taga_ag_gob_04_desc: "虽仍以牧为主，但田块已有简单灌溉，青稞黍收成较稳。"
 
 building_type_taga_ag_dsr_01: "薄田"
 building_type_taga_ag_dsr_01_desc: "沙漠边缘的零星耕地，依赖人工灌溉。"
 
 building_taga_ag_dsr_01: "沙缘小畦"
 building_taga_ag_dsr_01_desc: "在沙地边缘开辟的极小田块，全靠沟渠引水。"
 
 building_taga_ag_dsr_02: "坎井田"
 building_taga_ag_dsr_02_desc: "利用地下暗渠引水，减少蒸发，可种青稞与黍。"
 
 building_taga_ag_dsr_03: "绿洲田"
 building_taga_ag_dsr_03_desc: "小片绿洲中的耕地，沟渠纵横，作物开始多样化。"
 
 building_taga_ag_dsr_04: "沃洲田"
 building_taga_ag_dsr_04_desc: "经多年淤灌，沙地变为可稳定耕作的土壤，但面积仍有限。"
 
 building_type_taga_ag_ct_plt_01: "旱田"
 building_type_taga_ag_ct_plt_01_desc: "高原上的雨养耕地，以粟为主，后来加入麦类。"
 
 building_taga_ag_ct_plt_01: "坡耕地"
 building_taga_ag_ct_plt_01_desc: "原始的坡地开垦，烧荒后撒播粟种，产量低。"
 
 building_taga_ag_ct_plt_02: "垄作田"
 building_taga_ag_ct_plt_02_desc: "采用垄沟种植，保墒耐旱，牛耕渐多。"
 
 building_taga_ag_ct_plt_03: "麦粟轮作田"
 building_taga_ag_ct_plt_03_desc: "粟与夏麦隔年轮作，避免连作障碍，石磨普及。"
 
 building_taga_ag_ct_plt_04: "豆麦复种田"
 building_taga_ag_ct_plt_04_desc: "麦收后复种豆类，固氮养地，地力得以维持。"
 
 building_type_taga_ag_ct_hil_01: "小旱田"
 building_type_taga_ag_ct_hil_01_desc: "丘陵间的小块旱地，地块破碎，以人力耕作为主。"
 
 building_taga_ag_ct_hil_01: "丘坡地"
 building_taga_ag_ct_hil_01_desc: "顺坡开垦的小块地，易水土流失，种黍。"
 
 building_taga_ag_ct_hil_02: "平治田"
 building_taga_ag_ct_hil_02_desc: "稍加平整的小块地，转种粟，产量略有提高。"
 
 building_taga_ag_ct_hil_03: "堰地"
 building_taga_ag_ct_hil_03_desc: "沿等高线筑堰拦水，减缓冲刷，开始麦粟并种。"
 
 building_taga_ag_ct_hil_04: "石坎梯田"
 building_taga_ag_ct_hil_04_desc: "用石块垒坎成梯，地块虽小但保水保肥，夏麦加入。"
 
 building_type_taga_ag_wt_fld_01: "良田"
 building_type_taga_ag_wt_fld_01_desc: "土质肥沃的大田，适宜精耕细作。"
 
 building_taga_ag_wt_fld_01: "畎亩"
 building_taga_ag_wt_fld_01_desc: "开沟起垄的田制，粟麦并种，地力基础好。"
 
 building_taga_ag_wt_fld_02: "麦豆田"
 building_taga_ag_wt_fld_02_desc: "冬麦收获后种豆，豆科养地，一年两收。"
 
 building_taga_ag_wt_fld_03: "粟麦复种田"
 building_taga_ag_wt_fld_03_desc: "麦收后及时整地种粟，形成稳定两熟制。"
 
 building_taga_ag_wt_fld_04: "上腴之田"
 building_taga_ag_wt_fld_04_desc: "灌溉与施肥配合，粟麦轮作成熟，产量居前。"
 
 building_type_taga_ag_wt_pln_01: "农田"
 building_type_taga_ag_wt_pln_01_desc: "开阔平原上的大田，便于统一灌溉与耕作。"
 
 building_taga_ag_wt_pln_01: "平畴"
 building_taga_ag_wt_pln_01_desc: "平整的大片田地，以粟麦为主，沟渠初具。"
 
 building_taga_ag_wt_pln_02: "阡陌田"
 building_taga_ag_wt_pln_02_desc: "田间道路与沟渠规整，豆麦复种开始出现。"
 
 building_taga_ag_wt_pln_03: "沃野"
 building_taga_ag_wt_pln_03_desc: "经过长期耕种，土壤熟化，粟麦两熟制推广。"
 
 building_taga_ag_wt_pln_04: "渠灌农田"
 building_taga_ag_wt_pln_04_desc: "干支渠配套，旱能灌涝能排，产量稳定。"
 
 building_type_taga_ag_wt_hil_01: "小农田"
 building_type_taga_ag_wt_hil_01_desc: "丘陵地带的小块农田，多依赖山泉或陂塘。"
 
 building_taga_ag_wt_hil_01: "坡田"
 building_taga_ag_wt_hil_01_desc: "在较缓坡地上开垦的小田，粟麦间作。"
 
 building_taga_ag_wt_hil_02: "麦田"
 building_taga_ag_wt_hil_02_desc: "因丘陵夏旱，转以冬麦为主，避开夏旱。"
 
 building_taga_ag_wt_hil_03: "豆麦田"
 building_taga_ag_wt_hil_03_desc: "麦后复种豆类，一年两收，地力不衰。"
 
 building_taga_ag_wt_hil_04: "粟麦田"
 building_taga_ag_wt_hil_04_desc: "梯田与陂塘改善，粟麦复种成为可能。"
 
 building_type_taga_ag_nst_pln_01: "水旱田"
 building_type_taga_ag_nst_pln_01_desc: "可水可旱的平原田，主要种植水稻与冬麦。"
 
 building_taga_ag_nst_pln_01: "沤田"
 building_taga_ag_nst_pln_01_desc: "长期淹水的稻田，一年一熟，耕作粗放。"
 
 building_taga_ag_nst_pln_02: "稻粟田"
 building_taga_ag_nst_pln_02_desc: "水稻收后排水种粟，开始水旱轮作。"
 
 building_taga_ag_nst_pln_03: "稻麦田"
 building_taga_ag_nst_pln_03_desc: "水稻后种冬麦，一年两熟，需要排灌及时。"
 
 building_taga_ag_nst_pln_04: "陂塘灌田"
 building_taga_ag_nst_pln_04_desc: "陂塘与沟渠配套，稻麦两熟稳定，收成丰厚。"
 
 building_type_taga_ag_nst_hil_01: "水旱梯田"
 building_type_taga_ag_nst_hil_01_desc: "丘陵中的水旱轮作梯田，需较强提水能力。"
 
 building_taga_ag_nst_hil_01: "山坳田"
 building_taga_ag_nst_hil_01_desc: "利用山泉灌溉的小块稻田，一年一熟。"
 
 building_taga_ag_nst_hil_02: "稻粟梯田"
 building_taga_ag_nst_hil_02_desc: "梯田成形，稻后种粟，水旱交替。"
 
 building_taga_ag_nst_hil_03: "筒车梯田"
 building_taga_ag_nst_hil_03_desc: "筒车提水上山，保证稻田需水，稻麦轮作。"
 
 building_taga_ag_nst_hil_04: "稻麦梯田"
 building_taga_ag_nst_hil_04_desc: "梯田保水与排水兼顾，冬麦成为固定冬作。"
 
 building_type_taga_ag_mst_pln_01: "水田"
 building_type_taga_ag_mst_pln_01_desc: "多雨区的水田，可发展多熟制。"
 
 building_taga_ag_mst_pln_01: "稻田"
 building_taga_ag_mst_pln_01_desc: "普通稻田，一年一熟，品种单一。"
 
 building_taga_ag_mst_pln_02: "稻麦田"
 building_taga_ag_mst_pln_02_desc: "稻后种麦，一年两熟，麦作南移。"
 
 building_taga_ag_mst_pln_03: "双季稻田"
 building_taga_ag_mst_pln_03_desc: "早稻晚稻连作，一年两收，需育秧移栽。"
 
 building_taga_ag_mst_pln_04: "三熟田"
 building_taga_ag_mst_pln_04_desc: "双季稻后再种一季短生粟，土地几乎不闲。"
 
 building_type_taga_ag_mst_hil_01: "水梯田"
 building_type_taga_ag_mst_hil_01_desc: "丘陵中的水田，依靠梯田蓄水。"
 
 building_taga_ag_mst_hil_01: "山田"
 building_taga_ag_mst_hil_01_desc: "依山开垦的小块稻田，水源不稳定。"
 
 building_taga_ag_mst_hil_02: "稻粟梯田"
 building_taga_ag_mst_hil_02_desc: "梯田巩固，稻后种粟，增加一季。"
 
 building_taga_ag_mst_hil_03: "稻麦梯田"
 building_taga_ag_mst_hil_03_desc: "冬麦引入，水旱轮作，减少病虫害。"
 
 building_taga_ag_mst_hil_04: "双季梯田"
 building_taga_ag_mst_hil_04_desc: "品种改良使双季稻可行，产量大增。"
 
 building_type_taga_ag_mst_vly_01: "小水田"
 building_type_taga_ag_mst_vly_01_desc: "河谷中的狭长水田，水源充足但地块小。"
 
 building_taga_ag_mst_vly_01: "溪谷田"
 building_taga_ag_mst_vly_01_desc: "沿溪流开垦的小田，种稻为主。"
 
 building_taga_ag_mst_vly_02: "稻麦田"
 building_taga_ag_mst_vly_02_desc: "利用河谷暖冬，稻后种麦，水旱轮作。"
 
 building_taga_ag_mst_vly_03: "双季坝田"
 building_taga_ag_mst_vly_03_desc: "筑坝拦水，保证双季稻用水。"
 
 building_taga_ag_mst_vly_04: "恒产田"
 building_taga_ag_mst_vly_04_desc: "双季稻稳定，地块虽小，产出可观。"
 
 building_type_taga_ag_sst_bsn_01: "圩田"
 building_type_taga_ag_sst_bsn_01_desc: "低洼盆地中筑堤围田，排水与灌溉并重。"
 
 building_taga_ag_sst_bsn_01: "渚田"
 building_taga_ag_sst_bsn_01_desc: "利用天然水渚种稻，易涝。"
 
 building_taga_ag_sst_bsn_02: "圩埂田"
 building_taga_ag_sst_bsn_02_desc: "筑圩埂挡水，内开沟渠，单季稻稳定。"
 
 building_taga_ag_sst_bsn_03: "双季圩田"
 building_taga_ag_sst_bsn_03_desc: "排灌系统完善，双季稻成为常态。"
 
 building_taga_ag_sst_bsn_04: "三熟圩田"
 building_taga_ag_sst_bsn_04_desc: "双季稻后复种冬作，豆麦轮换，地力不衰。"
 
 building_type_taga_ag_sst_hil_01: "梯田"
 building_type_taga_ag_sst_hil_01_desc: "高温丘陵上的梯田，开发难度大。"
 
 building_taga_ag_sst_hil_01: "山梯"
 building_taga_ag_sst_hil_01_desc: "简单的坡地梯田，种稻，产量低。"
 
 building_taga_ag_sst_hil_02: "叠石梯田"
 building_taga_ag_sst_hil_02_desc: "用石块叠坎，稳定田面，单季稻为主。"
 
 building_taga_ag_sst_hil_03: "双季梯田"
 building_taga_ag_sst_hil_03_desc: "早熟稻引入，双季稻开始推广。"
 
 building_taga_ag_sst_hil_04: "豆稻梯田"
 building_taga_ag_sst_hil_04_desc: "双季稻后种豆，养地与增产兼顾。"

 building_type_taga_ds_wall_01: "城墙"
 building_type_taga_ds_wall_01_desc: "围绕聚落的防御工事，随着历代增筑而愈发坚固。"
 building_taga_ds_wall_01: "夯土城墙"
 building_taga_ds_wall_01_desc: "最基础的夯筑土墙，能有效迟滞敌军，但难以抵御长期围攻。"
 building_taga_ds_wall_02: "壕沟悬门"
 building_taga_ds_wall_02_desc: "在城门处增挖壕沟并设可升降的悬门，守备更为严密。"
 building_taga_ds_wall_03: "外郭鹿角"
 building_taga_ds_wall_03_desc: "城外增设木制鹿角与外墙，扩大防御纵深。"
 building_taga_ds_wall_04: "马面敌楼"
 building_taga_ds_wall_04_desc: "城墙突出马面并建敌楼，便于交叉射击攻城之敌。"
 building_taga_ds_wall_05: "瓮城暗门"
 building_taga_ds_wall_05_desc: "城门外加筑瓮城，并设暗门以便守军突然出击。"
 building_taga_ds_wall_06: "三合土"
 building_taga_ds_wall_06_desc: "以三合土加固墙体，使城墙更加坚实耐久。"
 building_taga_ds_wall_07: "包砖"
 building_taga_ds_wall_07_desc: "在土墙外包砌砖石，足以抵御投石与冲撞。"
 building_taga_ds_wall_08: "多重城墙"
 building_taga_ds_wall_08_desc: "层层套叠的城垣体系，令攻方即使破城也寸步难行。"

 building_type_taga_ds_fort_01: "堡垒"
 building_type_taga_ds_fort_01_desc: "用于警戒、封锁与驻军的小型防御设施，多设于要道与边地。"
 building_taga_ds_fort_01: "哨所"
 building_taga_ds_fort_01_desc: "最基础的瞭望警戒点，仅有少量士卒驻守。"
 building_taga_ds_fort_02: "烽燧"
 building_taga_ds_fort_02_desc: "高台举火传讯，日夜可通警情，但无力阻挡敌军。"
 building_taga_ds_fort_03: "障城"
 building_taga_ds_fort_03_desc: "有墙障护的小型城障，可屯兵与储存军资。"
 building_taga_ds_fort_04: "坞堡"
 building_taga_ds_fort_04_desc: "豪强或驻军修筑的坚固坞壁，可自守一时。"
 building_taga_ds_fort_05: "坞堡群"
 building_taga_ds_fort_05_desc: "多座坞堡互为犄角，形成防御网络。"
 building_taga_ds_fort_06: "城垒"
 building_taga_ds_fort_06_desc: "规模更大的军事城垒，能容纳较多守军。"
 building_taga_ds_fort_07: "城垒群"
 building_taga_ds_fort_07_desc: "连片成群的城垒，控制大片区域。"
 building_taga_ds_fort_08: "卫城"
 building_taga_ds_fort_08_desc: "拱卫主城的强大支城，兵甲充足，易守难攻。"

 building_type_taga_mi_forestry_01: "山虞"
 building_type_taga_mi_forestry_01_desc: "掌管山林川泽的官署，负责采伐林木、征集山泽物产，以充军资。"
 building_taga_mi_forestry_01: "山虞"
 building_taga_mi_forestry_01_desc: "基础的林业官署，为攻城器械与弓弩部队提供材料。"
 building_taga_mi_forestry_02: "木官"
 building_taga_mi_forestry_02_desc: "更完善的林木采伐与加工体系，进一步强化攻城与射击兵种。"

 building_type_taga_mi_navy_01: "楼船官"
 building_type_taga_mi_navy_01_desc: "统管水军与船队的官署，着力提升军队的机动能力。"
 building_taga_mi_navy_01: "楼船官"
 building_taga_mi_navy_01_desc: "负责建造与调度战船，增强行军速度与散兵作战能力。"
 building_taga_mi_navy_02: "船屯"
 building_taga_mi_navy_02_desc: "大型水军驻地，船队规模扩大，机动性与散兵战力显著提升。"

 building_type_taga_mi_arsenal_01: "工官"
 building_type_taga_mi_arsenal_01_desc: "掌管百工与兵器制造的官署，为步兵与枪兵提供装备。"
 building_taga_mi_arsenal_01: "工官"
 building_taga_mi_arsenal_01_desc: "基础的军械作坊，改进长枪与重步兵的装备。"
 building_taga_mi_arsenal_02: "发弩官"
 building_taga_mi_arsenal_02_desc: "专司弩机制作与改良，强化远程射击与步兵战力。"
 building_taga_mi_arsenal_03: "武库"
 building_taga_mi_arsenal_03_desc: "大型军械仓库，各类兵器储备充足，全面加强各兵种。"

 building_type_taga_mi_pasturage_01: "苑令"
 building_type_taga_mi_pasturage_01_desc: "掌管牧苑与马政，培育战马，增强骑兵与机动能力。"
 building_taga_mi_pasturage_01: "苑令"
 building_taga_mi_pasturage_01_desc: "初级牧苑，改良马匹，提升骑兵战力与行军速度。"
 building_taga_mi_pasturage_02: "牧官"
 building_taga_mi_pasturage_02_desc: "更大规模的牧马官署，马匹质量与数量均有提升，骑兵更加强劲。"

 building_type_taga_mi_castra_01: "小型军营"
 building_type_taga_mi_castra_01_desc: "常备军营，为驻军提供训练与后勤，降低维持成本。"
 building_taga_mi_castra_01: "小型军营"
 building_taga_mi_castra_01_desc: "基础军营，轻微提升驻军战力并减少维护开支。"
 building_taga_mi_castra_02: "中型军营"
 building_taga_mi_castra_02_desc: "规模扩大的军营，进一步强化驻军并节省开支。"
 building_taga_mi_castra_03: "大型军营"
 building_taga_mi_castra_03_desc: "大型常备军营，驻军战力与后勤效率显著提高。"
 building_taga_mi_castra_04: "镇所"
 building_taga_mi_castra_04_desc: "边境或要地的镇戍之所，驻军获得最大程度的加强。"

 building_type_taga_mi_colonia_01: "民屯"
 building_type_taga_mi_colonia_01_desc: "组织民户屯田，以军养军，大幅降低兵士维持费用。"
 building_taga_mi_colonia_01: "民屯"
 building_taga_mi_colonia_01_desc: "招募流民开垦荒地，减轻兵士的日常开支。"
 building_taga_mi_colonia_02: "军屯"
 building_taga_mi_colonia_02_desc: "以军队直接屯田，进一步降低维护成本。"
 building_taga_mi_colonia_03: "中型军屯"
 building_taga_mi_colonia_03_desc: "规模更大的军屯，屯田收益显著，兵士维持费用更低。"
 building_taga_mi_colonia_04: "大型军屯"
 building_taga_mi_colonia_04_desc: "最大规模的军屯体系，几乎自给自足，极大减轻财政负担。"

 building_type_taga_infra_horreum_01: "仓廪"
 building_type_taga_infra_horreum_01_desc: "储粮备荒，调节丰歉，但维持仓廪本身亦需耗费。"
 building_taga_infra_horreum_01: "小廪"
 building_taga_infra_horreum_01_desc: "几座土坯仓房，聊以存放余粮，维持不易。"
 building_taga_infra_horreum_02: "中廪"
 building_taga_infra_horreum_02_desc: "仓房扩建，储粮渐多，但对县库的负担也随之加重。"
 building_taga_infra_horreum_03: "大廪"
 building_taga_infra_horreum_03_desc: "规模宏大的仓群，足以影响一地粮价，维持费用高昂。"
 building_taga_infra_horreum_04: "巨廪"
 building_taga_infra_horreum_04_desc: "囤积如山的粮储，是灾年的保障，也是日常的重负。"
 building_type_taga_infra_via_01: "道路"
 building_type_taga_infra_via_01_desc: "平整道路，便利行旅，但修治维护亦需民力。"
 building_taga_infra_via_01: "乡道"
 building_taga_infra_via_01_desc: "夯土为路，连接乡里，略便运输。"
 building_taga_infra_via_02: "县道"
 building_taga_infra_via_02_desc: "铺石加固，行旅稍安，但修路之费不菲。"
 building_taga_infra_via_03: "官道"
 building_taga_infra_via_03_desc: "宽阔官道，车马通行无阻，盗匪亦少，维护甚巨。"
 building_taga_infra_via_04: "驰道"
 building_taga_infra_via_04_desc: "驰道坦荡，驿站相望，商旅辐辏，然劳费极重。"

 building_type_taga_fc_hemp_01: "麻田"
 building_type_taga_fc_hemp_01_desc: "栽麻取皮，沤后取缕，可织粗布、搓绳索。"
 building_taga_fc_hemp_01: "小片麻田"
 building_taga_fc_hemp_01_desc: "数亩麻地，岁取之皮仅足自给。"
 building_taga_fc_hemp_02: "麻田"
 building_taga_fc_hemp_02_desc: "麻田连畦，沤麻绩缕，出产渐充。"
 building_taga_fc_hemp_03: "大片麻田"
 building_taga_fc_hemp_03_desc: "麻田广辟，麻缕既多，绳布外贩。"
 building_taga_fc_hemp_04: "广袤麻田"
 building_taga_fc_hemp_04_desc: "四野植麻，沤制绩缕，麻布绳缆远输他郡。"

 building_type_taga_fc_ramie_01: "苎麻田"
 building_type_taga_fc_ramie_01_desc: "苎麻喜温润，剥皮沤制，得缕细白，最宜夏布。"
 building_taga_fc_ramie_01: "小片苎麻田"
 building_taga_fc_ramie_01_desc: "初辟苎地，岁获未定，仅足补家用。"
 building_taga_fc_ramie_02: "苎麻田"
 building_taga_fc_ramie_02_desc: "连畦苎麻，剥沤得法，始有夏布输市。"
 building_taga_fc_ramie_03: "大片苎麻田"
 building_taga_fc_ramie_03_desc: "苎麻满畴，所出细缕为织户争购。"
 building_taga_fc_ramie_04: "广袤苎麻田"
 building_taga_fc_ramie_04_desc: "环望皆苎，夏布之利冠于一方。"

 building_type_taga_fc_silk_01: "丝织坊"
 building_type_taga_fc_silk_01_desc: "植桑育蚕，缫茧取丝，工序繁密，成帛乃贵。"
 building_taga_fc_silk_01: "蚕房"
 building_taga_fc_silk_01_desc: "小户育蚕，得茧不多，所缫丝仅易米盐。"
 building_taga_fc_silk_02: "丝织坊"
 building_taga_fc_silk_02_desc: "桑园蚕室并举，缫织有序，能出细帛。"
 building_taga_fc_silk_03: "织锦坊"
 building_taga_fc_silk_03_desc: "坊中专织锦绮，花样繁复，非良工不能为。"
 building_taga_fc_silk_04: "大织坊"
 building_taga_fc_silk_04_desc: "织机数十，昼夜相应，所出丝帛贩及远方。"

 building_type_taga_fc_cotton_01: "棉田"
 building_type_taga_fc_cotton_01_desc: "植棉取絮，去子弹松，可纺纱织布。"
 building_taga_fc_cotton_01: "小片棉田"
 building_taga_fc_cotton_01_desc: "新开棉地，所收尚薄，聊助纺织。"
 building_taga_fc_cotton_02: "棉田"
 building_taga_fc_cotton_02_desc: "棉田成片，花开时白遍原野，棉絮渐多。"
 building_taga_fc_cotton_03: "大片棉田"
 building_taga_fc_cotton_03_desc: "广植棉花，秋收堆积若云，纺织之利可观。"
 building_taga_fc_cotton_04: "广袤棉田"
 building_taga_fc_cotton_04_desc: "棉田弥望，絮积如山，布匹转贩四境。"

 building_type_taga_fc_wool_01: "牧场"
 building_type_taga_fc_wool_01_desc: "逐水草而牧，羊群所出毛皮，可衣可帐。"
 building_taga_fc_wool_01: "小牧场"
 building_taga_fc_wool_01_desc: "畜群未众，岁取毛皮仅供一户之需。"
 building_taga_fc_wool_02: "牧场"
 building_taga_fc_wool_02_desc: "牛羊渐蕃，毛毡皮革岁有所出。"
 building_taga_fc_wool_03: "大牧场"
 building_taga_fc_wool_03_desc: "畜群满野，毛货丰盈，商旅来收。"
 building_taga_fc_wool_04: "广袤牧场"
 building_taga_fc_wool_04_desc: "牧场无垠，毛皮积若丘山，然草场难继。"

 building_type_taga_cc_grape_01: "葡萄园"
 building_type_taga_cc_grape_01_desc: "葡萄宜旱地，引蔓上架，秋实可食，亦可酿酒。"
 building_taga_cc_grape_01: "小葡萄园"
 building_taga_cc_grape_01_desc: "新栽葡萄，藤未满架，所获尚少。"
 building_taga_cc_grape_02: "大葡萄园"
 building_taga_cc_grape_02_desc: "园中葡萄成荫，秋实累累，酒果并售。"

 building_type_taga_cc_pear_01: "山梨园"
 building_type_taga_cc_pear_01_desc: "山梨宜山地，果脆而甘，可鲜食，亦可曝为脯。"
 building_taga_cc_pear_01: "小片山梨园"
 building_taga_cc_pear_01_desc: "初栽梨树，结果未繁，仅供近邻。"
 building_taga_cc_pear_02: "大片山梨园"
 building_taga_cc_pear_02_desc: "梨林成片，秋果满筐，梨脯外售。"

 building_type_taga_cc_peach_01: "果林"
 building_type_taga_cc_peach_01_desc: "桃李诸果，宜植暖处，花开可赏，果熟可食。"
 building_taga_cc_peach_01: "小片果林"
 building_taga_cc_peach_01_desc: "新植树苗，尚未成林，所产无几。"
 building_taga_cc_peach_02: "大片果林"
 building_taga_cc_peach_02_desc: "果林蔚然，桃李满枝，鲜果干脯并出。"

 building_type_taga_cc_citrus_01: "柑橘园"
 building_type_taga_cc_citrus_01_desc: "柑橘宜温润，果皮芳香，果肉甘美，耐久藏，可远贩。"
 building_taga_cc_citrus_01: "小片柑橘园"
 building_taga_cc_citrus_01_desc: "新植柑橘，树未成荫，所获有限。"
 building_taga_cc_citrus_02: "大片柑橘园"
 building_taga_cc_citrus_02_desc: "柑橘成林，金实满园，利市甚厚。"

 building_type_taga_cc_lychee_01: "荔枝园"
 building_type_taga_cc_lychee_01_desc: "荔枝生炎方，畏霜雪，果名甚重而移植难。"
 building_taga_cc_lychee_01: "小片荔枝园"
 building_taga_cc_lychee_01_desc: "新辟荔园，树苗尚稀，所产多为土人食用。"
 building_taga_cc_lychee_02: "大片荔枝园"
 building_taga_cc_lychee_02_desc: "荔树成林，岁收珍果，商贩争趋，然采运颇难。"