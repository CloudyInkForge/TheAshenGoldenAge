l_simp_chinese:
 building_type_taga_xian_01: "县廷"
 building_type_taga_xian_01_desc: "这种帝国的底层行政区维持起来并不容易，但也是帝国的租调徭役所系，庞大的官署区配合上英明的令长，或能有所成效。"
 building_taga_xian_01: "寺曹"
 building_taga_xian_01_desc: "官署区是县的根本，创造了它的权力，也带来了不小的成本。"
 building_taga_xian_02: "中型县"
 building_taga_xian_02_desc: "逐渐壮大的县成熟了起来，强大的组织能力令他敢于面对大部分不虞。"
 building_taga_xian_03: "大型县"
 building_taga_xian_03_desc: "以万计的农户聚集在了行政区内，这是发展的动力，不过县令精力有限，行政成本因而增加。"
 building_taga_xian_04: "巨型县"
 building_taga_xian_04_desc: "西汉的中原，宋时的江南，这样的县只会出现在帝国的核心区，成本巨大，收益颇丰。"

 building_taga_ag_jgl_01: "牧田初辟"
 building_taga_ag_jgl_01_desc: "在牧草地中辟出的小片田地，多种黍。租税微薄，聊胜于无，但开辟所费尚轻。"
 building_taga_ag_jgl_02: "青稞黍田"
 building_taga_ag_jgl_02_desc: "牧田渐熟，添种青稞，农牧相兼。租税稍稳，聚落生聚略有起色。"
 building_taga_ag_jgl_03: "粟黍深畴"
 building_taga_ag_jgl_03_desc: "青稞、黍、粟轮作，地力渐厚。税入增加，只是生聚之效仍缓。"
 building_taga_ag_jgl_04: "丰稔牧畴"
 building_taga_ag_jgl_04_desc: "牧田尽化沃壤，青稞、黍、粟丰登。税入可观，成为一方农牧之本。"
 
 building_taga_ag_gob_01: "试种牧地"
 building_taga_ag_gob_01_desc: "在牧场中试种黍，农牧兼营。租税甚微，但改造成本极低。"
 building_taga_ag_gob_02: "青稞牧场"
 building_taga_ag_gob_02_desc: "青稞与黍并植，牧场渐熟。产出略有起色，畜牧仍可并行不废。"
 building_taga_ag_gob_03: "精耕牧畴"
 building_taga_ag_gob_03_desc: "精耕细作之后，青稞、黍稳产。税入平稳，为聚落添一份常赋。"
 building_taga_ag_gob_04: "沃野牧原"
 building_taga_ag_gob_04_desc: "牧场化为沃野，青稞与黍丰登。地方生聚渐显，是农牧结合的典范。"
 
 building_taga_ag_dsr_01: "薄田"
 building_taga_ag_dsr_01_desc: "贫瘠薄田，仅宜青稞。租税微薄，聊补生计，开辟工本不高。"
 building_taga_ag_dsr_02: "青稞薄畴"
 building_taga_ag_dsr_02_desc: "薄田稍治，添种黍，青稞、黍相济。产出小幅提升，然生聚仍缓。"
 building_taga_ag_dsr_03: "深耕薄壤"
 building_taga_ag_dsr_03_desc: "深耕薄壤，地力渐复。青稞与黍收成趋稳，税入略增。"
 building_taga_ag_dsr_04: "丰饶薄畴"
 building_taga_ag_dsr_04_desc: "连年培肥之后，薄田终成丰饶之地。青稞、黍稳产，为一方可靠农源。"
 
 building_taga_ag_ct_plt_01: "粟田"
 building_taga_ag_ct_plt_01_desc: "旱田初辟，单种粟米。租税尚可，是旱作区重要的起点，工本较低。"
 building_taga_ag_ct_plt_02: "粟麦熟田"
 building_taga_ag_ct_plt_02_desc: "旱田渐熟，粟与夏麦轮作。产出提高，税入增加，改造成本仍然适中。"
 building_taga_ag_ct_plt_03: "精耕旱畴"
 building_taga_ag_ct_plt_03_desc: "精耕细作后，粟、夏麦并茂。税入趋稳，旱作优势进一步发挥。"
 building_taga_ag_ct_plt_04: "豆麦丰野"
 building_taga_ag_ct_plt_04_desc: "豆麦夏种，旱田化为沃野。税入跃升，为当地发展提供强劲动力。"
 
 building_taga_ag_ct_hil_01: "小旱田"
 building_taga_ag_ct_hil_01_desc: "小旱田初辟，单种黍米。租税虽薄，但开垦成本极低，适合山地聚落。"
 building_taga_ag_ct_hil_02: "粟熟小旱"
 building_taga_ag_ct_hil_02_desc: "改种粟后，小旱田产出明显提升。税入渐丰，地方生聚保持稳定。"
 building_taga_ag_ct_hil_03: "粟麦精耕"
 building_taga_ag_ct_hil_03_desc: "小旱田增种夏麦，粟麦轮作。税入渐丰，成为山地间难得的精耕地。"
 building_taga_ag_ct_hil_04: "小旱丰稔"
 building_taga_ag_ct_hil_04_desc: "小旱田精耕至熟，粟、夏麦稳产。农产已足，为山地聚落所赖。"
 
 building_taga_ag_wt_fld_01: "良田"
 building_taga_ag_wt_fld_01_desc: "良田初治，粟麦并种。租税已属可观，是上好的耕作根基。"
 building_taga_ag_wt_fld_02: "豆麦良田"
 building_taga_ag_wt_fld_02_desc: "豆麦轮作，良田地力愈肥。税入与地方生聚均有明显增益。"
 building_taga_ag_wt_fld_03: "膏腴良畴"
 building_taga_ag_wt_fld_03_desc: "深耕至膏腴，粟麦稳产。良田成为区域农业的核心，税入丰厚。"
 building_taga_ag_wt_fld_04: "沃野良田"
 building_taga_ag_wt_fld_04_desc: "良田尽为沃野，粟麦丰登。这般田土在关中或郑国渠旁并不稀奇，但在边郡却是难得的膏腴。"
 
 building_taga_ag_wt_pln_01: "农田"
 building_taga_ag_wt_pln_01_desc: "农田初辟，粟麦并种。产出稳定，是聚落日常所系。"
 building_taga_ag_wt_pln_02: "豆麦农田"
 building_taga_ag_wt_pln_02_desc: "豆麦轮作后农田渐熟。税入增加，地方生聚稍有提升。"
 building_taga_ag_wt_pln_03: "精耕农畴"
 building_taga_ag_wt_pln_03_desc: "精耕农亩，粟麦并茂。产出再上台阶，税入可观。"
 building_taga_ag_wt_pln_04: "丰稔农田"
 building_taga_ag_wt_pln_04_desc: "农田化为丰稔之畴，粟麦稳产。为地方繁荣提供源源不断的给养。"
 
 building_taga_ag_wt_hil_01: "小农田"
 building_taga_ag_wt_hil_01_desc: "小农田初垦，粟麦间作。规模虽有限，但胜在开垦便宜。"
 building_taga_ag_wt_hil_02: "麦熟小田"
 building_taga_ag_wt_hil_02_desc: "专种麦后，小农田产出渐稳。税入略增，升级成本适中。"
 building_taga_ag_wt_hil_03: "豆麦精耕"
 building_taga_ag_wt_hil_03_desc: "豆麦轮作，小农田地力改善。税入持续上升。"
 building_taga_ag_wt_hil_04: "小亩丰稔"
 building_taga_ag_wt_hil_04_desc: "小农田精耕至熟，粟麦皆宜。成为丘陵间稳定的农产来源。"
 
 building_taga_ag_nst_pln_01: "水旱田"
 building_taga_ag_nst_pln_01_desc: "水旱田初辟，专种水稻。租税已颇丰厚，但前期改造不菲。"
 building_taga_ag_nst_pln_02: "稻粟水旱"
 building_taga_ag_nst_pln_02_desc: "稻粟轮作，水旱田渐熟。税入与地方生聚同步提升。"
 building_taga_ag_nst_pln_03: "稻麦深畴"
 building_taga_ag_nst_pln_03_desc: "水旱田深耕细作，稻麦两宜。产出能力进一步增强。"
 building_taga_ag_nst_pln_04: "水旱丰稔"
 building_taga_ag_nst_pln_04_desc: "水旱田化为丰稔之畴，稻麦稳产。堪称当地的粮仓。"
 
 building_taga_ag_nst_hil_01: "水旱梯田"
 building_taga_ag_nst_hil_01_desc: "水旱梯田初辟，单种水稻。租税尚可，开垦难度较低。"
 building_taga_ag_nst_hil_02: "稻粟熟阶"
 building_taga_ag_nst_hil_02_desc: "梯阶渐熟，稻粟轮作。产出与地方生聚均有起色。"
 building_taga_ag_nst_hil_03: "稻麦精耕"
 building_taga_ag_nst_hil_03_desc: "稻麦精耕，水旱梯田的耕作强度与产出同步提升。"
 building_taga_ag_nst_hil_04: "水旱丰梯"
 building_taga_ag_nst_hil_04_desc: "梯田尽熟，稻麦稳产。成为山地间难得的丰稔之阶。"
 
 building_taga_ag_mst_pln_01: "水田"
 building_taga_ag_mst_pln_01_desc: "水田初辟，稻粟轮作。租税丰厚，惟开垦与维护成本高昂。"
 building_taga_ag_mst_pln_02: "稻麦熟泽"
 building_taga_ag_mst_pln_02_desc: "水田渐熟，稻麦两宜。产出继续提升，地方生聚略有增加。"
 building_taga_ag_mst_pln_03: "双季深田"
 building_taga_ag_mst_pln_03_desc: "深耕后双季连作，水田产出跃升，成为区域最重要的农地。"
 building_taga_ag_mst_pln_04: "稻粟丰泽"
 building_taga_ag_mst_pln_04_desc: "水田化为丰泽，双季稻与粟轮作不辍。税入极丰，发展增益显著。"
 
 building_taga_ag_mst_hil_01: "水梯田"
 building_taga_ag_mst_hil_01_desc: "水梯田初辟，单种水稻。租税尚稳，适合山地聚落经营。"
 building_taga_ag_mst_hil_02: "稻粟熟梯"
 building_taga_ag_mst_hil_02_desc: "梯阶渐熟，稻粟轮作。产出与地方生聚皆有所提升。"
 building_taga_ag_mst_hil_03: "稻麦精耕"
 building_taga_ag_mst_hil_03_desc: "稻麦精耕，水梯田的耕作效率与税入进一步提高。"
 building_taga_ag_mst_hil_04: "双季丰梯"
 building_taga_ag_mst_hil_04_desc: "水梯田可种双季稻，产出丰盈，成为山地农业的典范。"
 
 building_taga_ag_mst_vly_01: "小水田"
 building_taga_ag_mst_vly_01_desc: "小水田初垦，单种水稻。租税尚可，改造成本较低。"
 building_taga_ag_mst_vly_02: "稻麦熟田"
 building_taga_ag_mst_vly_02_desc: "稻麦轮作后，小水田产出接近翻倍。地方生聚渐起。"
 building_taga_ag_mst_vly_03: "双季深泽"
 building_taga_ag_mst_vly_03_desc: "深耕后双季稻连作，小水田产出趋稳。农产已足。"
 building_taga_ag_mst_vly_04: "小水丰稔"
 building_taga_ag_mst_vly_04_desc: "小水田终成丰稔之地，双季稻稳产。发展增益持续。"
 
 building_taga_ag_sst_bsn_01: "圩田"
 building_taga_ag_sst_bsn_01_desc: "新筑圩田，单种水稻。租税不低，但筑圩成本很高。"
 building_taga_ag_sst_bsn_02: "双季稻熟"
 building_taga_ag_sst_bsn_02_desc: "圩田初熟，双季稻连作。税入几乎翻倍，地方生聚开始抬头。"
 building_taga_ag_sst_bsn_03: "稻豆精耕"
 building_taga_ag_sst_bsn_03_desc: "稻豆精耕，圩田产出再上层楼。圩岸设施渐趋完善。"
 building_taga_ag_sst_bsn_04: "稻麦丰圩"
 building_taga_ag_sst_bsn_04_desc: "稻麦丰圩，圩田成为沿河低地最丰饶的农地。这般圩田在江淮水乡并不罕见，但在边地却是难得的丰饶。"
 
 building_taga_ag_sst_hil_01: "梯田"
 building_taga_ag_sst_hil_01_desc: "梯田初垦，单种水稻。租税尚可，但开垦成本较高。"
 building_taga_ag_sst_hil_02: "稻熟梯阶"
 building_taga_ag_sst_hil_02_desc: "梯阶渐熟，水稻稳产。产出略有提升，地方生聚仍缓。"
 building_taga_ag_sst_hil_03: "双季深梯"
 building_taga_ag_sst_hil_03_desc: "梯田可种双季稻。税入明显提高，地方生聚开始显现。"
 building_taga_ag_sst_hil_04: "稻豆丰梯"
 building_taga_ag_sst_hil_04_desc: "稻豆轮作，梯田产出更加多元。成为山地间的重要农地。"